services:
  - type: web
    name: pharmpear
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    domains:
      - pharmpear.com
      - www.pharmpear.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SECRET_KEY
        sync: false
