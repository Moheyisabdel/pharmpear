services:
  - type: web
    name: pharmpear
    runtime: static
    buildCommand: echo "PharmPear static site"
    staticPublishPath: public
    domains:
      - pharmpear.com
      - www.pharmpear.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
