services:
  - type: web
    name: pharmpear
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT -c gunicorn_conf.py
    domains:
      - pharmpear.com
      - www.pharmpear.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_WORKER
        value: "1"
      - key: GMAIL_TOKEN_JSON
        sync: false
